<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Treehouse Park City — opening winter 2027</title>
    <meta
      name="description"
      content="Park City's one and only indoor playground. Opening winter 2027."
    />

    <!--
      TEMPORARY HOLDING PAGE. Standalone on purpose: one folder, two files, no
      build step. Drag `holding/` onto Netlify and it deploys.

      WHY THIS IS WHITE-ON-MINT RATHER THAN THE BRAND'S FULL PALETTE.
      Measured against this mint (#4da17e), the fun colours vanish:
      flamingo 1.00:1, ocean 1.14:1, pine 2.13:1 — and every colour in the
      full-colour wordmark falls between 1.36 and 2.24, under the 3:1 a
      graphic needs. On a mint flood the only legible marks are white
      (3.13:1) and ink (5.57:1). The white wordmark exists for exactly this.

      THE TYPE SIZES ARE LOAD-BEARING. White on mint is 3.13:1 — over WCAG's
      3:1 bar for large text, under the 4.5:1 it would need at body size.
      Everything here is 24px or larger on purpose. Shrink any of it and it
      fails. Ink on the same mint is 5.57:1 and would pass at any size, if
      the type ever needs to get smaller.

      THE COLOURS ARE A SNAPSHOT, NOT A REFERENCE. A plain HTML file cannot
      read the real site's design tokens, so these are copied from
      app/globals.css as of 12 Nov 2026. If the palette changes there, this
      page will not follow.

      The fonts load from Google's CDN. The real site self-hosts the same ones
      at build time via next/font, so this page makes a third-party request
      the real site does not.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Betania+Patmos&family=Libre+Baskerville:wght@400&family=Quicksand:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        /* Copied from app/globals.css — see the note above. */
        --mint: #4da17e;
        /* Pure white, not the site's linen. On mint, linen is 3.01:1 — over
           the 3:1 large-text bar by a hundredth. White is 3.13:1. Visually
           identical here, and not balanced on a knife edge. */
        --paper: #ffffff;
        /* Only used for the button's label once it fills on hover. */
        --pine: #416625;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        /* min-height, not height: a short viewport scrolls rather than
           clipping the wordmark.

           NOTE: at 70svh this is usually SHORTER than the content plus its
           padding, so the body sizes to its content and there is no spare
           height for `justify-content` to distribute — the centring below,
           and the tablet-up centring further down, stop having any effect.
           The page still looks like a full flood because a body background
           paints the whole canvas. Raise this to 100svh if centring should
           come back. */
        min-height: 70svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(1.5rem, 1.1rem + 1.9vw, 3.5rem);
        padding-inline: clamp(1rem, 0.5rem + 2vw, 2rem);
        text-align: center;

        /* Phones start near the top rather than centring. Centring put 192px
           of empty space above AND below on an 844px screen, which reads as
           a mistaken top margin rather than as composition. A measured
           offset puts the content where the eye expects it and leaves the
           slack at the bottom, where it looks like room rather than error. */
        justify-content: flex-start;
        padding-block: clamp(3.5rem, 11vh, 7rem) clamp(2rem, 6vh, 4rem);

        background: var(--mint);
        color: var(--paper);
        font-family: "Libre Baskerville", serif;
      }

      /* From tablet up there is enough height for centring to read as
         deliberate, and the content is a larger share of the screen. */
      @media (min-width: 48rem) {
        body {
          justify-content: center;
          padding-block: clamp(2rem, 1rem + 5vw, 4rem);
        }
      }

      .ring {
        width: clamp(7rem, 5rem + 10vw, 11rem);
        height: auto;
        display: block;
      }

      /* role="img" + aria-label names the inline SVG; the SVG itself is
         aria-hidden so the name is not announced twice. */
      .wordmark {
        width: min(22rem, 80vw);
        color: var(--paper);
      }
      .wordmark svg {
        width: 100%;
        height: auto;
        display: block;
      }

      h1 {
        margin: 0;
        font-family: "Quicksand", sans-serif;
        /* 600, and it is requested in the font URL above — asking for a
           weight that is not loaded makes the browser synthesise one, which
           looks smeared rather than lighter. */
        font-weight: 600;
        /* Floors at 28px: see the note on type sizes above. */
        font-size: clamp(1.75rem, 1.4rem + 1.9vw, 2.625rem);
        line-height: 1.15;
        /* No max-width: the headline runs as wide as the page allows, and
           text-wrap: balance evens the lines it does need. An earlier 18ch
           cap forced three short lines on a wide screen. */
        text-wrap: balance;
      }

      .lines {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      p {
        margin: 0;
        max-width: 26ch;
        /* Floors at 24px, for the same reason. */
        font-size: clamp(1.5rem, 1.4rem + 0.4vw, 1.75rem);
        line-height: 1.4;
        text-wrap: pretty;
      }

      /* White outline, white label. A filled ocean button is not an option on
         this background — ocean on mint is 1.14:1, so the button would have
         no edge at all. The outline is 3.13:1 against mint, over the 3:1 that
         1.4.11 asks of a control's boundary. */
      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3.5rem;
        padding: 0.75rem 2.25rem;
        border: 2px solid var(--paper);
        border-radius: 999px;

        color: var(--paper);
        font-family: "Quicksand", sans-serif;
        /* 24px like everything else, and for the same reason — not emphasis. */
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1;
        text-decoration: none;

        transition:
          background-color 200ms ease-out,
          color 200ms ease-out;
      }

      /* Fills on hover AND focus-visible, so a keyboard user gets the same
         feedback. Pine on white is 6.66:1; mint on white would be 3.13:1 —
         the same thin margin as the resting state, and no reason to carry it
         into a state we are free to choose. */
      .cta:hover,
      .cta:focus-visible {
        background: var(--paper);
        color: var(--pine);
      }

      .cta:focus-visible {
        outline: 3px solid var(--paper);
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .cta {
          transition-duration: 0.01ms;
        }
      }
    </style>
  </head>
